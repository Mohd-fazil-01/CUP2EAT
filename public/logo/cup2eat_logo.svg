<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Outer Deep Forest Green Background Gradient -->
    <radialGradient id="greenDiskGrad" cx="45%" cy="40%" r="60%">
      <stop offset="0%" stopColor="#0B4B37" />
      <stop offset="55%" stopColor="#063526" />
      <stop offset="100%" stopColor="#032117" />
    </radialGradient>

    <!-- Metallic Gold Outer Bevel Gradient -->
    <linearGradient id="goldOuterRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#FDEAA8" />
      <stop offset="25%" stopColor="#D8A843" />
      <stop offset="50%" stopColor="#8F6218" />
      <stop offset="75%" stopColor="#F5C968" />
      <stop offset="100%" stopColor="#7A4D0F" />
    </linearGradient>

    <!-- Metallic Gold Inner Bevel Gradient -->
    <linearGradient id="goldInnerRing" x1="100%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stopColor="#FCE79F" />
      <stop offset="30%" stopColor="#D29E38" />
      <stop offset="70%" stopColor="#7E5014" />
      <stop offset="100%" stopColor="#E9B958" />
    </linearGradient>

    <!-- 3D Beveled Lettering Gradient (Top Highlight to Bottom Shadow) -->
    <linearGradient id="goldLetterFace" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stopColor="#FFF2BF" />
      <stop offset="25%" stopColor="#F5CD6D" />
      <stop offset="60%" stopColor="#C99432" />
      <stop offset="100%" stopColor="#8A5A19" />
    </linearGradient>

    <!-- Shadow for Letters -->
    <filter id="debossShadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#000000" flood-opacity="0.75" />
      <feDropShadow dx="0" dy="-1" stdDeviation="1.5" flood-color="#FFEBB0" flood-opacity="0.3" />
    </filter>

    <filter id="outerGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Base Circle Shadow -->
  <circle cx="250" cy="254" r="236" fill="#000000" opacity="0.35" filter="blur(6px)" />

  <!-- Outer Heavy Metallic Gold Rim -->
  <circle cx="250" cy="250" r="236" fill="url(#goldOuterRing)" />

  <!-- Dark Groove Between Outer and Inner Rim -->
  <circle cx="250" cy="250" r="226" fill="#241505" />

  <!-- Inner Metallic Gold Lip -->
  <circle cx="250" cy="250" r="222" fill="url(#goldInnerRing)" />

  <!-- Recessed Forest Green Center Medallion -->
  <circle cx="250" cy="250" r="212" fill="url(#greenDiskGrad)" />

  <!-- Inner Subtle Groove on Green -->
  <circle cx="250" cy="250" r="208" fill="none" stroke="#021710" stroke-width="2.5" opacity="0.8" />
  <circle cx="250" cy="250" r="206" fill="none" stroke="#FCE79F" stroke-width="0.8" opacity="0.25" />

  <!-- Typography & Decorative Elements Group with 3D Emboss Filter -->
  <g filter="url(#debossShadow)">
    
    <!-- WORD: CUP -->
    <g id="word-cup">
      <!-- 3D Bevel Extrusion Shadows (Dark Bronze Underlayer) -->
      <text
        x="250"
        y="172"
        text-anchor="middle"
        font-family="'Playfair Display', 'Cinzel', 'Times New Roman', Georgia, serif"
        font-size="124"
        font-weight="900"
        letter-spacing="14"
        fill="#3A2107"
        stroke="#2E1803"
        stroke-width="10"
        stroke-linejoin="round"
      >
        CUP
      </text>
      <!-- Gold Face Layer -->
      <text
        x="250"
        y="170"
        text-anchor="middle"
        font-family="'Playfair Display', 'Cinzel', 'Times New Roman', Georgia, serif"
        font-size="124"
        font-weight="900"
        letter-spacing="14"
        fill="url(#goldLetterFace)"
        stroke="#FFF7D6"
        stroke-width="1.5"
      >
        CUP
      </text>
    </g>

    <!-- HORIZONTAL DIVIDER BARS WITH SERIF END-CAPS -->
    <g id="dividers" stroke="url(#goldLetterFace)" stroke-linecap="square">
      <!-- Left Bar -->
      <line x1="72" y1="250" x2="190" y2="250" stroke-width="6" />
      <line x1="72" y1="240" x2="72" y2="260" stroke-width="6" /> <!-- Left End Cap -->

      <!-- Right Bar -->
      <line x1="310" y1="250" x2="428" y2="250" stroke-width="6" />
      <line x1="428" y1="240" x2="428" y2="260" stroke-width="6" /> <!-- Right End Cap -->
    </g>

    <!-- NUMBER: 2 -->
    <g id="number-2">
      <!-- 3D Extrusion Shadow -->
      <text
        x="250"
        y="290"
        text-anchor="middle"
        font-family="'Playfair Display', 'Cinzel', 'Times New Roman', Georgia, serif"
        font-size="134"
        font-weight="900"
        fill="#3A2107"
        stroke="#2E1803"
        stroke-width="12"
        stroke-linejoin="round"
      >
        2
      </text>
      <!-- Gold Face Layer -->
      <text
        x="250"
        y="287"
        text-anchor="middle"
        font-family="'Playfair Display', 'Cinzel', 'Times New Roman', Georgia, serif"
        font-size="134"
        font-weight="900"
        fill="url(#goldLetterFace)"
        stroke="#FFF7D6"
        stroke-width="1.8"
      >
        2
      </text>
    </g>

    <!-- WORD: EAT -->
    <g id="word-eat">
      <!-- 3D Extrusion Shadow -->
      <text
        x="250"
        y="410"
        text-anchor="middle"
        font-family="'Playfair Display', 'Cinzel', 'Times New Roman', Georgia, serif"
        font-size="124"
        font-weight="900"
        letter-spacing="14"
        fill="#3A2107"
        stroke="#2E1803"
        stroke-width="10"
        stroke-linejoin="round"
      >
        EAT
      </text>
      <!-- Gold Face Layer -->
      <text
        x="250"
        y="408"
        text-anchor="middle"
        font-family="'Playfair Display', 'Cinzel', 'Times New Roman', Georgia, serif"
        font-size="124"
        font-weight="900"
        letter-spacing="14"
        fill="url(#goldLetterFace)"
        stroke="#FFF7D6"
        stroke-width="1.5"
      >
        EAT
      </text>
    </g>

  </g>

  <!-- Ambient Surface Sheen Across The Glass/Medallion -->
  <path
    d="M 60 210 Q 250 80 440 210 A 212 212 0 0 0 60 210 Z"
    fill="#FFFFFF"
    opacity="0.04"
  />
</svg>
